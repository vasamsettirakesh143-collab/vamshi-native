<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Vamshi AI</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="app">

        <div class="chat-header">
            <div class="header-title">
                <span class="header-dot"></span>
                Vamshi AI
            </div>
            <div class="header-status" id="status">Ready</div>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input-bar">
            <input
                type="text"
                id="textInput"
                class="text-input"
                placeholder="Message Vamshi..."
                autocomplete="off"
            />
            <button type="button" id="micBtn" class="icon-btn" aria-label="Voice input">
                🎤
            </button>
            <button type="button" id="sendBtn" class="icon-btn send-btn" aria-label="Send">
                ➤
            </button>
        </div>

    </div>

    <script src="config.js"></script>
    <script src="memory.js"></script>
    <script src="apps.js"></script>
    <script src="app.js"></script>
    <script src="script.js"></script>

</body>

</html>
