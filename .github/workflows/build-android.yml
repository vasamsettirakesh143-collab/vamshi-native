name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Patch AndroidManifest
        run: |
          python3 - <<'EOF'
          path = "android/app/src/main/AndroidManifest.xml"

          with open(path) as f:
              content = f.read()

          permissions = '''  <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.CALL_PHONE" />
            <uses-permission android:name="android.permission.READ_CONTACTS" />
          '''

          content = content.replace(
              "<application",
              permissions + '\n    <application\n        android:name=".VamshiApp"',
              1
          )

          service_decl = '''    <service
                android:name=".VamshiForegroundService"
                android:exported="false"
                android:foregroundServiceType="microphone" />

            <service
                android:name=".VamshiAccessibilityService"
                android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                android:exported="false">
                <intent-filter>
                    <action android:name="android.accessibilityservice.AccessibilityService" />
                </intent-filter>
                <meta-data
                    android:name="android.accessibilityservice"
                    android:resource="@xml/accessibility_service_config" />
            </service>

            <service
                android:name=".VamshiNotificationListenerService"
                android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                android:exported="false">
                <intent-filter>
                    <action android:name="android.service.notification.NotificationListenerService" />
                </intent-filter>
            </service>
          </application>'''

          content = content.replace("</application>", service_decl, 1)

          queries = '''  <queries>
              <intent>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
              </intent>
          </queries>
          </manifest>'''

          content = content.replace("</manifest>", queries, 1)

          with open(path, "w") as f:
              f.write(content)
          EOF

      - name: Sync web assets into the native project
        run: npx cap sync android

      - name: Inject native plugins and resources
        run: |
          mkdir -p android/app/src/main/java/com/vamshi/ai

          cp native/AppLauncherUtil.java android/app/src/main/java/com/vamshi/ai/AppLauncherUtil.java
          cp native/AppLauncherNativePlugin.java android/app/src/main/java/com/vamshi/ai/AppLauncherNativePlugin.java
          cp native/CallUtil.java android/app/src/main/java/com/vamshi/ai/CallUtil.java
          cp native/ContactLookupUtil.java android/app/src/main/java/com/vamshi/ai/ContactLookupUtil.java
          cp native/VamshiForegroundService.java android/app/src/main/java/com/vamshi/ai/VamshiForegroundService.java
          cp native/VamshiAccessibilityService.java android/app/src/main/java/com/vamshi/ai/VamshiAccessibilityService.java
          cp native/VamshiNotificationListenerService.java android/app/src/main/java/com/vamshi/ai/VamshiNotificationListenerService.java
          cp native/VamshiApp.java android/app/src/main/java/com/vamshi/ai/VamshiApp.java
          cp native/MainActivity.java android/app/src/main/java/com/vamshi/ai/MainActivity.java

          mkdir -p android/app/src/main/res/xml
          cp native/accessibility_service_config.xml android/app/src/main/res/xml/accessibility_service_config.xml

          python3 - <<'EOF'
          from pathlib import Path

          java_folder = Path("android/app/src/main/java/com/vamshi/ai")

          for java_file in java_folder.glob("*.java"):
              source = java_file.read_text()

              if not source.lstrip().startswith("package "):
                  java_file.write_text(
                      "package com.vamshi.ai;\n\n" + source
                  )
          EOF

      - name: Verify Java package declarations
        run: |
          head -n 3 android/app/src/main/java/com/vamshi/ai/MainActivity.java
          head -n 3 android/app/src/main/java/com/vamshi/ai/AppLauncherNativePlugin.java
          head -n 3 android/app/src/main/java/com/vamshi/ai/AppLauncherUtil.java

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vamshi-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
