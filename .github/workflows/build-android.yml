name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Add package visibility queries
        run: |
          python3 - <<'EOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          queries = '''  <queries>
              <package android:name="com.whatsapp" />
              <package android:name="com.instagram.android" />
              <package android:name="com.google.android.youtube" />
              <package android:name="com.google.android.calculator" />
            </queries>
          </manifest>'''
          content = content.replace("</manifest>", queries)
          with open(path, "w") as f:
              f.write(content)
          EOF

      - name: Sync web assets into the native project
        run: npx cap sync android

      - name: Inject native App Launcher plugin
        run: |
          mkdir -p android/app/src/main/java/com/vamshi/ai
          cp native/AppLauncherNativePlugin.java android/app/src/main/java/com/vamshi/ai/AppLauncherNativePlugin.java
          cp native/MainActivity.java android/app/src/main/java/com/vamshi/ai/MainActivity.java

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vamshi-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
