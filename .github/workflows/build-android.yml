name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Force native package name to com.vamshi.ai
        run: |
          python3 - <<'EOF'
          import re

          path = "android/app/build.gradle"

          with open(path) as f:
              content = f.read()

          content = re.sub(
              r'namespace\s+"[^"]*"',
              'namespace "com.vamshi.ai"',
              content
          )
          content = re.sub(
              r'applicationId\s+"[^"]*"',
              'applicationId "com.vamshi.ai"',
              content
          )

          with open(path, "w") as f:
              f.write(content)
          EOF

      - name: Add recyclerview dependency
        run: |
          python3 - <<'EOF'
          path = "android/app/build.gradle"

          with open(path) as f:
              content = f.read()

          recycler = "    implementation 'androidx.recyclerview:recyclerview:1.3.2'\n"

          if "androidx.recyclerview" not in content:
              content = content.replace(
                  "dependencies {",
                  "dependencies {\n" + recycler,
                  1
              )

          with open(path, "w") as f:
              f.write(content)
          EOF

      - name: Patch AndroidManifest
        run: |
          python3 - <<'EOF'
          import re

          path = "android/app/src/main/AndroidManifest.xml"

          with open(path) as f:
              content = f.read()

          permissions = '''  <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.CALL_PHONE" />
            <uses-permission android:name="android.permission.READ_CONTACTS" />
            <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
          '''

          content = content.replace(
              "<application",
              permissions + '\n    <application\n        android:name=".VamshiApp"',
              1
          )

          theme = 'android:theme="@style/Theme.AppCompat.NoActionBar"'

          content = re.sub(
              r'android:theme="[^"]*"',
              theme,
              content
          )

          if 'android:theme=' not in content:
              content = content.replace(
                  '<application',
                  '<application\n        ' + theme,
                  1
              )

          service_decl = '''    <service
                android:name=".VamshiForegroundService"
                android:exported="false"
                android:foregroundServiceType="microphone" />

            <service
                android:name=".VamshiAccessibilityService"
                android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                android:exported="false">
                <intent-filter>
                    <action android:name="android.accessibilityservice.AccessibilityService" />
                </intent-filter>
                <meta-data
                    android:name="android.accessibilityservice"
                    android:resource="@xml/accessibility_service_config" />
            </service>

            <service
                android:name=".VamshiNotificationListenerService"
                android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                android:exported="false">
                <intent-filter>
                    <action android:name="android.service.notification.NotificationListenerService" />
                </intent-filter>
            </service>

            <receiver
                android:name=".BootReceiver"
                android:enabled="true"
                android:exported="true">
                <intent-filter>
                    <action android:name="android.intent.action.BOOT_COMPLETED" />
                </intent-filter>
            </receiver>
          </application>'''

          content = content.replace("</application>", service_decl, 1)

          queries = '''  <queries>
              <intent>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
              </intent>
          </queries>
          </manifest>'''

          content = content.replace("</manifest>", queries, 1)

          with open(path, "w") as f:
              f.write(content)
          EOF

      - name: Print final manifest for verification
        run: cat android/app/src/main/AndroidManifest.xml

      - name: Sync web assets into the native project
        run: npx cap sync android

      - name: Inject native plugins and resources
        run: |
          mkdir -p android/app/src/main/java/com/vamshi/ai

          cp native/AppLauncherUtil.java android/app/src/main/java/com/vamshi/ai/AppLauncherUtil.java
          cp native/AppLauncherNativePlugin.java android/app/src/main/java/com/vamshi/ai/AppLauncherNativePlugin.java
          cp native/CallUtil.java android/app/src/main/java/com/vamshi/ai/CallUtil.java
          cp native/ContactLookupUtil.java android/app/src/main/java/com/vamshi/ai/ContactLookupUtil.java
          cp native/VamshiForegroundService.java android/app/src/main/java/com/vamshi/ai/VamshiForegroundService.java
          cp native/VamshiAccessibilityService.java android/app/src/main/java/com/vamshi/ai/VamshiAccessibilityService.java
          cp native/VamshiNotificationListenerService.java android/app/src/main/java/com/vamshi/ai/VamshiNotificationListenerService.java
          cp native/VamshiApp.java android/app/src/main/java/com/vamshi/ai/VamshiApp.java
          cp native/MainActivity.java android/app/src/main/java/com/vamshi/ai/MainActivity.java
          cp native/ChatMessage.java android/app/src/main/java/com/vamshi/ai/ChatMessage.java
          cp native/ChatAdapter.java android/app/src/main/java/com/vamshi/ai/ChatAdapter.java
          cp native/BootReceiver.java android/app/src/main/java/com/vamshi/ai/BootReceiver.java

          mkdir -p android/app/src/main/res/xml
          cp native/accessibility_service_config.xml android/app/src/main/res/xml/accessibility_service_config.xml

          mkdir -p android/app/src/main/res/layout
          cp native/activity_main.xml android/app/src/main/res/layout/activity_main.xml
          cp native/chat_item.xml android/app/src/main/res/layout/chat_item.xml

          mkdir -p android/app/src/main/res/drawable
          cp native/bubble_user.xml android/app/src/main/res/drawable/bubble_user.xml
          cp native/bubble_bot.xml android/app/src/main/res/drawable/bubble_bot.xml
          cp native/input_devil.xml android/app/src/main/res/drawable/input_devil.xml
                    

          python3 - <<'EOF'
          from pathlib import Path

          java_folder = Path("android/app/src/main/java/com/vamshi/ai")

          for java_file in java_folder.glob("*.java"):
              source = java_file.read_text()

              if not source.lstrip().startswith("package "):
                  java_file.write_text(
                      "package com.vamshi.ai;\n\n" + source
                  )
          EOF

      - name: Verify Java package declarations
        run: |
          head -n 3 android/app/src/main/java/com/vamshi/ai/MainActivity.java
          head -n 3 android/app/src/main/java/com/vamshi/ai/AppLauncherNativePlugin.java
          head -n 3 android/app/src/main/java/com/vamshi/ai/AppLauncherUtil.java

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vamshi-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
