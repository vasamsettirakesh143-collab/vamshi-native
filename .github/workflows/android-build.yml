name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Sync web assets
        run: npx cap sync android

      - name: Copy native Java files
        run: |
          mkdir -p android/app/src/main/java/com/vamshi/ai
          cp native/*.java android/app/src/main/java/com/vamshi/ai/

      - name: Fix Java package declarations
        run: |
          cd android/app/src/main/java/com/vamshi/ai
          for f in *.java; do
            if grep -q '^package ' "$f"; then
              sed -i 's/^package .*/package com.vamshi.ai;/' "$f"
            else
              printf 'package com.vamshi.ai;\n\n' | cat - "$f" > tmp && mv tmp "$f"
            fi
          done

      - name: Copy native resources and manifest
        run: |
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/drawable
          cp native/accessibility_service_config.xml android/app/src/main/res/xml/
          cp native/activity_main.xml native/chat_item.xml android/app/src/main/res/layout/
          cp native/bubble_user.xml native/bubble_bot.xml native/input_devil.xml android/app/src/main/res/drawable/

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vamshi-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
